version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # hibernate-validator 8+ requires Java 17; uuidulid-validation stays on Java 8
      - dependency-name: "org.hibernate.validator:hibernate-validator"
        versions: [">=8.0.0"]
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
