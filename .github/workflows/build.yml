name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Full reactor on the JDKs Spring Boot 3 supports.
  full:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify

  # The library modules on their real minimum runtimes.
  legacy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 8
            modules: uuidulid-core,uuidulid-jackson,uuidulid-jpa,uuidulid-jpa-javax,uuidulid-spring-boot2-starter
          - java: 11
            modules: uuidulid-core,uuidulid-jackson,uuidulid-jpa,uuidulid-jpa-javax,uuidulid-spring-boot2-starter,uuidulid-hibernate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify -pl ${{ matrix.modules }} -am
